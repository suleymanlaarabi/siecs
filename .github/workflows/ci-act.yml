name: CI (act)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: bake ${{ matrix.config }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: clang-18
            cc: clang-18
            compiler_package: clang-18
            config: debug
          - compiler: clang-18
            cc: clang-18
            compiler_package: clang-18
            config: release

    env:
      CC: ${{ matrix.cc }}

    steps:
      - uses: actions/checkout@v5

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.compiler_package }}

      - name: Install bake
        run: |
          git clone https://github.com/SanderMertens/bake
          make -C bake/build-$(uname)
          bake/bake setup

      - name: Install deps
        run: sh tools/install_bake_deps.sh

      - name: Build library
        run: |
          if [ "${{ matrix.config }}" = "release" ]; then
            make build-c-release
          else
            make build-c
          fi

      - name: Build tests
        run: |
          if [ "${{ matrix.config }}" = "release" ]; then
            make build-test-release
          else
            make build-test
          fi

      - name: Run tests
        run: |
          if [ "${{ matrix.config }}" = "release" ]; then
            make test-c-release
          else
            make test-c
          fi

  leaks:
    name: leak checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CC: clang-18

    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18

      - name: Install bake
        run: |
          git clone https://github.com/SanderMertens/bake
          make -C bake/build-$(uname)
          bake/bake setup

      - name: Install deps
        run: sh tools/install_bake_deps.sh

      - name: Run leak checks
        run: make test-leaks

  distr:
    name: distr up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make

      - name: Install bake
        run: |
          git clone https://github.com/SanderMertens/bake
          make -C bake/build-$(uname)
          bake/bake setup

      - name: Check generated distribution
        env:
          CC: clang
        run: make check-distr

      - name: Check standalone distribution
        env:
          CC: clang
        run: make check-distr-standalone
