name: CI (act)

on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

jobs:
  build:
    name: bake ubuntu clang-18 ${{ matrix.config }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: debug
          - config: release

    env:
      CC: clang-18

    steps:
      - uses: actions/checkout@v5

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18

      - name: Install bake
        run: |
          git clone https://github.com/suleymanlaarabi/bake
          make -C bake/build-$(uname)
          bake/bake setup

      - name: Build library
        run: |
          if [ "${{ matrix.config }}" = "release" ]; then
            bake rebuild . -r --cfg release
          else
            bake rebuild . -r
          fi

      - name: Build tests
        run: |
          if [ "${{ matrix.config }}" = "release" ]; then
            bake rebuild test -r --cfg release
          else
            bake rebuild test -r
          fi

      - name: Run tests
        run: |
          if [ "${{ matrix.config }}" = "release" ]; then
            bake run test --cfg release
          else
            bake run test
          fi

  distr:
    name: distr up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make

      - name: Install bake
        run: |
          git clone https://github.com/suleymanlaarabi/bake
          make -C bake/build-$(uname)
          bake/bake setup

      - name: Build generated distribution
        env:
          CC: clang
        run: make distr

      - name: Check standalone distribution
        env:
          CC: clang
        run: make check-distr-standalone

      - name: Report generated distribution diff
        run: |
          if ! git diff --quiet -- distr/siecs.c distr/siecs.h include/siecs/bake_config.h; then
            git diff --stat -- distr/siecs.c distr/siecs.h include/siecs/bake_config.h
            echo "::warning::generated distribution differs from HEAD; commit the generated files before pushing"
          fi
