# This workflow stays Linux-only because act runs GitHub-hosted jobs in Docker
# by default. The native Windows job lives in ci.yml and needs a Windows host.
name: CI (act)

on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

jobs:
  build:
    name: bake ubuntu Clang ${{ matrix.config }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: debug
          - config: release
          - config: asan
          - config: ubsan
          - config: lsan

    env:
      CC: clang-18
      CXX: clang++-18

    steps:
      - uses: actions/checkout@v5

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18

      - name: Install bake
        run: |
          git clone https://github.com/suleymanlaarabi/bake
          make -C bake/build-$(uname)
          bake/bake setup

      - name: Build library
        run: |
          CC=clang-18 CXX=clang++-18 bake rebuild . -r --cfg "${{ matrix.config }}"

      - name: Build tests
        run: |
          CC=clang-18 CXX=clang++-18 bake rebuild test -r --cfg "${{ matrix.config }}"
          CC=clang-18 CXX=clang++-18 bake rebuild test/cpp -r --cfg "${{ matrix.config }}"

      - name: Run tests
        if: matrix.config != 'lsan'
        run: |
          CC=clang-18 CXX=clang++-18 bake run test --cfg "${{ matrix.config }}"
          CC=clang-18 CXX=clang++-18 bake run test/cpp --cfg "${{ matrix.config }}"

      - name: Run tests with LeakSanitizer
        if: matrix.config == 'lsan'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          LSAN_OPTIONS: exitcode=23:halt_on_error=1
        run: |
          CC=clang-18 CXX=clang++-18 bake run test --cfg lsan
          CC=clang-18 CXX=clang++-18 bake run test/cpp --cfg lsan

  distr:
    name: distr up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 make

      - name: Install bake
        run: |
          git clone https://github.com/suleymanlaarabi/bake
          make -C bake/build-$(uname)
          bake/bake setup

      - name: Build generated distribution
        env:
          CC: clang-18
        run: make distr

      - name: Check standalone distribution
        env:
          CC: clang-18
        run: make check-distr-standalone

      - name: Report generated distribution diff
        run: |
          if ! git diff --quiet -- distr/siecs.c distr/siecs.h include/siecs/bake_config.h; then
            git diff --stat -- distr/siecs.c distr/siecs.h include/siecs/bake_config.h
            echo "::warning::generated distribution differs from HEAD; commit the generated files before pushing"
          fi
