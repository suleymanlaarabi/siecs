name: CI

on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: bake ${{ matrix.os }} ${{ matrix.compiler }} ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: Clang
            cc: clang-18
            cxx: clang++-18
            compiler_package: clang-18
            config: debug
          - os: ubuntu-24.04
            compiler: Clang
            cc: clang-18
            cxx: clang++-18
            compiler_package: clang-18
            config: release
          - os: ubuntu-24.04
            compiler: Clang
            cc: clang-18
            cxx: clang++-18
            compiler_package: clang-18
            config: asan
          - os: ubuntu-24.04
            compiler: Clang
            cc: clang-18
            cxx: clang++-18
            compiler_package: clang-18
            config: ubsan
          - os: ubuntu-24.04
            compiler: Clang
            cc: clang-18
            cxx: clang++-18
            compiler_package: clang-18
            config: lsan
          - os: ubuntu-24.04
            compiler: GCC
            cc: gcc-14
            cxx: g++-14
            compiler_package: gcc-14 g++-14
            config: debug
          - os: macos-latest
            compiler: Clang
            cc: clang
            cxx: clang++
            compiler_package: clang
            config: debug

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@v5

      - name: Install compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.compiler_package }}

      - name: Install bake
        run: |
          git clone https://github.com/suleymanlaarabi/bake
          make -C bake/build-$(uname)
          bake/bake setup

      - name: Build library
        run: |
          bake rebuild . -r --cfg "${{ matrix.config }}"

      - name: Build tests
        run: |
          bake rebuild test -r --cfg "${{ matrix.config }}"
          bake rebuild test/cpp -r --cfg "${{ matrix.config }}"

      - name: Run tests
        if: matrix.config != 'lsan'
        run: |
          bake run test --cfg "${{ matrix.config }}"
          bake run test/cpp --cfg "${{ matrix.config }}"

      - name: Run tests with LeakSanitizer
        if: matrix.config == 'lsan'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          LSAN_OPTIONS: exitcode=23:halt_on_error=1
        run: |
          bake run test --cfg lsan
          bake run test/cpp --cfg lsan

  windows:
    name: bake Windows clang-cl (MSVC ABI)
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Verify clang-cl
        shell: pwsh
        run: |
          clang-cl --version

      - name: Install bake
        shell: pwsh
        run: |
          git clone https://github.com/suleymanlaarabi/bake
          Push-Location bake/build-Windows
          nmake /NOLOGO /F bake.mak clean all
          Pop-Location
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\bake\bake.exe")) {
            throw "Bake was not built at $env:GITHUB_WORKSPACE\bake\bake.exe"
          }
          & "$env:GITHUB_WORKSPACE\bake\bake.exe" setup --local
          "$env:USERPROFILE\bake" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:USERPROFILE\bake\bake.exe" export CC=clang-cl
          & "$env:USERPROFILE\bake\bake.exe" export CXX=clang-cl

      - name: Build library and tests
        shell: pwsh
        run: |
          bake rebuild . -r
          bake rebuild test -r
          bake rebuild test/cpp -r

      - name: Run tests
        shell: pwsh
        run: |
          bake run test
          bake run test/cpp

  distr:
    name: distr up to date
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make

      - name: Install bake
        run: |
          git clone https://github.com/suleymanlaarabi/bake
          make -C bake/build-$(uname)
          bake/bake setup

      - name: Check generated distribution
        env:
          CC: clang
        run: make check-distr

      - name: Check standalone distribution
        env:
          CC: clang
        run: make check-distr-standalone
