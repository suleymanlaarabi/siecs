name: CI

on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: bake ${{ matrix.os }} ${{ matrix.compiler }} ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: clang-18
            cc: clang-18
            compiler_package: clang-18
            config: debug
          - os: ubuntu-24.04
            compiler: clang-18
            cc: clang-18
            compiler_package: clang-18
            config: release
          - os: macos-latest
            compiler: clang
            cc: clang
            compiler_package: clang
            config: debug

    env:
      CC: ${{ matrix.cc }}

    steps:
      - uses: actions/checkout@v5

      - name: Install compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.compiler_package }}

      - name: Install bake
        run: |
          git clone https://github.com/SanderMertens/bake
          make -C bake/build-$(uname)
          bake/bake setup

      - name: Build library
        run: |
          if [ "${{ matrix.config }}" = "release" ]; then
            bake rebuild -r --cfg release
          else
            bake rebuild -r
          fi

      - name: Build tests
        run: |
          if [ "${{ matrix.config }}" = "release" ]; then
            bake rebuild test -r --cfg release
          else
            bake rebuild test -r
          fi

      - name: Run tests
        run: |
          if [ "${{ matrix.config }}" = "release" ]; then
            bake run test --cfg release
          else
            bake run test
          fi

  cmake-consumer:
    name: cmake consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake

      - name: Configure C consumer
        run: cmake -S test/consumer_cmake/c -B build-consumer-c -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang

      - name: Build C consumer
        run: cmake --build build-consumer-c --parallel

      - name: Test C consumer
        run: ctest --test-dir build-consumer-c --output-on-failure

      - name: Configure C++ consumer
        run: cmake -S test/consumer_cmake/cpp -B build-consumer-cpp -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++

      - name: Build C++ consumer
        run: cmake --build build-consumer-cpp --parallel

      - name: Test C++ consumer
        run: ctest --test-dir build-consumer-cpp --output-on-failure

  distr:
    name: distr up to date
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make

      - name: Install bake
        run: |
          git clone https://github.com/SanderMertens/bake
          make -C bake/build-$(uname)
          bake/bake setup

      - name: Check generated distribution
        env:
          CC: clang
        run: make check-distr
