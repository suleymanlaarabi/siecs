name: CI

on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BAKE_COMMIT: cde5c8e5d5055363e602d58caa63c3b9c8d1a54e

jobs:
  build:
    name: bake ${{ matrix.os }} ${{ matrix.compiler }} ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: Clang
            cc: clang-18
            cxx: clang++-18
            config: debug
          - os: ubuntu-24.04
            compiler: Clang
            cc: clang-18
            cxx: clang++-18
            config: release
          - os: ubuntu-24.04
            compiler: Clang
            cc: clang-18
            cxx: clang++-18
            config: asan
          - os: ubuntu-24.04
            compiler: Clang
            cc: clang-18
            cxx: clang++-18
            config: ubsan
          - os: ubuntu-24.04
            compiler: Clang
            cc: clang-18
            cxx: clang++-18
            config: lsan
          - os: ubuntu-24.04
            compiler: GCC
            cc: gcc-14
            cxx: g++-14
            config: debug
          - os: macos-latest
            compiler: Clang
            cc: clang
            cxx: clang++
            config: debug

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@v5

      - name: Install SDL3 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype-dev libharfbuzz-dev
          git clone --depth 1 --branch release-3.4.16 https://github.com/libsdl-org/SDL.git
          cmake -S SDL -B SDL/build -DCMAKE_BUILD_TYPE=Release -DSDL_TEST_LIBRARY=OFF -DSDL_UNIX_CONSOLE_BUILD=ON
          cmake --build SDL/build --parallel 2
          sudo cmake --install SDL/build
          git clone --depth 1 --branch release-3.2.2 https://github.com/libsdl-org/SDL_ttf.git
          cmake -S SDL_ttf -B SDL_ttf/build -DCMAKE_BUILD_TYPE=Release -DSDLTTF_SAMPLES=OFF -DSDLTTF_VENDORED=OFF
          cmake --build SDL_ttf/build --parallel 2
          sudo cmake --install SDL_ttf/build
          sudo ldconfig

      - name: Install SDL3 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sdl3 sdl3_ttf
          SDL3_PREFIX="$(brew --prefix sdl3)"
          SDL3_TTF_PREFIX="$(brew --prefix sdl3_ttf)"
          echo "CPATH=$SDL3_TTF_PREFIX/include:$SDL3_PREFIX/include${CPATH:+:$CPATH}" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$SDL3_TTF_PREFIX/lib:$SDL3_PREFIX/lib${LIBRARY_PATH:+:$LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Install bake
        run: |
          git clone https://github.com/suleymanlaarabi/bake
          git -C bake checkout --detach "$BAKE_COMMIT"
          make -C bake/build-$(uname)
          bake/bake setup

      - name: Build library
        run: |
          bake rebuild . -r --cfg "${{ matrix.config }}"

      - name: Build tests
        run: |
          bake rebuild test -r --cfg "${{ matrix.config }}"
          bake rebuild test/cpp -r --cfg "${{ matrix.config }}"

      - name: Run tests
        if: matrix.config != 'lsan'
        run: |
          bake run test --cfg "${{ matrix.config }}"
          bake run test/cpp --cfg "${{ matrix.config }}"

      - name: Run tests with LeakSanitizer
        if: matrix.config == 'lsan'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          LSAN_OPTIONS: exitcode=23:halt_on_error=1
        run: |
          bake run test --cfg lsan
          bake run test/cpp --cfg lsan

  ui:
    name: SIUI SDL3 overlay and layout
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install SDL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype-dev libharfbuzz-dev libvulkan-dev glslc xxd
          git clone --depth 1 --branch release-3.4.16 https://github.com/libsdl-org/SDL.git
          cmake -S SDL -B SDL/build -DCMAKE_BUILD_TYPE=Release -DSDL_TEST_LIBRARY=OFF -DSDL_UNIX_CONSOLE_BUILD=ON
          cmake --build SDL/build --parallel 2
          sudo cmake --install SDL/build
          git clone --depth 1 --branch release-3.2.2 https://github.com/libsdl-org/SDL_ttf.git
          cmake -S SDL_ttf -B SDL_ttf/build -DCMAKE_BUILD_TYPE=Release -DSDLTTF_SAMPLES=OFF -DSDLTTF_VENDORED=OFF
          cmake --build SDL_ttf/build --parallel 2
          sudo cmake --install SDL_ttf/build
          sudo ldconfig
      - name: Install Bake
        run: |
          git clone https://github.com/suleymanlaarabi/bake
          git -C bake checkout --detach "$BAKE_COMMIT"
          make -C bake/build-$(uname)
          bake/bake setup
      - name: Build SIUI and tests
        run: |
          sh addons/ui/tools/embed_shaders.sh
          bake rebuild . -r
          bake rebuild addons/ui -r
          bake rebuild test/ui -r
          bake rebuild test/ui_cpp -r
          bake build example/ui
      - name: Run headless layout tests
        run: |
          bake run test/ui
          bake run test/ui_cpp

  windows:
    name: bake Windows MSVC
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install bake
        shell: pwsh
        run: |
          git clone https://github.com/suleymanlaarabi/bake
          git -C bake checkout --detach $env:BAKE_COMMIT
          Push-Location bake/build-Windows
          nmake /NOLOGO /F bake.mak clean all
          Pop-Location
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\bake\bake.exe")) {
            throw "Bake was not built at $env:GITHUB_WORKSPACE\bake\bake.exe"
          }
          & "$env:GITHUB_WORKSPACE\bake\bake.exe" setup --local
          "$env:USERPROFILE\bake" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build library and tests
        shell: pwsh
        run: |
          bake rebuild . -r --static --cfg debug
          bake rebuild test -r --static --cfg debug
          bake rebuild test/cpp -r --static --cfg debug

      - name: Run tests
        shell: pwsh
        run: |
          bake run test --static --cfg debug
          bake run test/cpp --static --cfg debug

  distr:
    name: distr up to date
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Install bake
        run: |
          git clone https://github.com/suleymanlaarabi/bake
          git -C bake checkout --detach "$BAKE_COMMIT"
          make -C bake/build-$(uname)
          bake/bake setup

      - name: Check generated distribution
        env:
          CC: clang
        run: make check-distr

      - name: Check standalone distribution
        env:
          CC: clang
        run: make check-distr-standalone

      - name: Check standalone C++ distribution
        env:
          CC: clang
          CXX: clang++
        run: make check-distr-cpp-standalone

  wasm:
    name: Emscripten WASM smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: clang
      CXX: clang++
      WASM_NODE: /usr/bin/node

    steps:
      - uses: actions/checkout@v5

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74

      - name: Install native build tools and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make chromium nodejs

      - name: Install bake
        run: |
          git clone https://github.com/suleymanlaarabi/bake
          git -C bake checkout --detach "$BAKE_COMMIT"
          make -C bake/build-$(uname)
          bake/bake setup

      - name: Regenerate distribution
        run: make distr

      - name: Build and run Node.js smoke tests
        run: make test-wasm

      - name: Run Chromium smoke test
        run: make test-wasm-browser

      - name: Check generated distribution
        env:
          CC: clang
        run: make check-distr
