name: Rust

on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Update vendored C sources
        run: make update-rust-vendor

      - name: Run Rust tests
        run: make test-rust

      - name: Check crates.io packages
        run: |
          cd bindings/siecs_rust
          derive_version="$(awk -F ' *= *' '$1 == "version" { gsub(/"/, "", $2); print $2; exit }' siecs_derive/Cargo.toml)"
          cargo package -p siecs_derive --allow-dirty
          if cargo search siecs_derive --limit 1 | grep -Eq "^siecs_derive = \"$derive_version\""; then
            cargo package -p siecs --allow-dirty
          else
            echo "Skipping siecs package verification until siecs_derive $derive_version is published on crates.io."
          fi
