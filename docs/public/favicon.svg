<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .light { display: inline; }
    .dark { display: none; }
    @media (prefers-color-scheme: light) {
      .light { display: inline; }
    }
    @media (prefers-color-scheme: dark) {
      .light { display: none; }
      .dark { display: inline; }
    }
  </style>
  <image class="light" href="/logo_nb.png" width="64" height="64" preserveAspectRatio="xMidYMid meet"/>
  <image class="dark" href="/logo_bn.png" width="64" height="64" preserveAspectRatio="xMidYMid meet"/>
</svg>
