[package]
name = "siecs"
version = "0.1.2"
edition = "2021"
links = "siecs"
description = "Rust bindings for SIECS"
readme = "README.md"
license = "MIT"
repository = "https://github.com/suleymanlaarabi/siecs"
homepage = "https://github.com/suleymanlaarabi/siecs"
documentation = "https://docs.rs/siecs"
keywords = ["ecs", "entity-component", "ffi", "gamedev"]
categories = ["data-structures", "game-development"]
include = [
    "Cargo.toml",
    "README.md",
    "build.rs",
    "src/**",
    "tests/**",
    "vendor/siecs.c",
    "vendor/siecs.h",
]

[workspace]
members = ["siecs_derive"]

[dependencies]
siecs_derive = { path = "siecs_derive", version = "0.1.0" }

[build-dependencies]
cc = "1"
